[package]
name = "cdd-core"
version = "0.0.5"
edition = "2021"

[dependencies]
# Error handling
derive_more = { version = "2.1", default-features = false, features = ["std", "from", "display", "error"] }

# AST Parsing
ra_ap_syntax = { version = "=0.0.360", default-features = false }
ra_ap_edition = { version = "=0.0.360", default-features = false }
unicode-ident = { version = "=1.0.24", default-features = false }
unicode-properties = { version = "=0.1.4", default-features = false }

# Regex for attributes and Arazzo criteria
regex = { version = "1.13", default-features = false, features = ["std"] }

# JSON/YAML Output & Parsing
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "preserve_order"] }
serde_yaml = { version = "0.9", default-features = false }

# OpenAPI definition types
utoipa = { version = "6.0", default-features = false, features = ["macros", "preserve_order", "uuid"] }
indexmap = { version = "2.14", default-features = false, features = ["std", "serde"] }

# Strict RFC 3986 URI resolution
url = { version = "2.5", default-features = false, features = ["std"] }
percent-encoding = { version = "2.3", default-features = false, features = ["std"] }

[lints]
workspace = true
