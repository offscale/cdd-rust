[package]
name = "cdd-web"
version = "0.0.4"
edition = "2021"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
actix-cors = { version = "0.7", default-features = false }
actix-web = { version = "4.18", default-features = false, features = ["macros"] }
async-trait = { version = "0.1", default-features = false }
cdd-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["now", "serde", "std"] }
derive_more = { version = "2.1", default-features = false, features = ["std", "display", "from", "error"] }
diesel = { version = "2.3", default-features = false, features = ["postgres", "r2d2", "chrono", "uuid"] }
fake = { version = "5.1", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1.0", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false, features = ["std"] }
uuid = { version = "1.29", default-features = false, features = ["std", "serde", "v4"] }

[dev-dependencies]
httpmock = { version = "0.9", default-features = false }
urlencoding = { version = "2.1", default-features = false }

[lints]
workspace = true
